[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabgen"
version = "0.1.0"
description = "Audio-to-guitar-tablature generator"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ingmar Aguiar", email = "ingmar.aguiar@gmail.com" }]
# Upper bound <3.12 because of the madmom dependency planned for later stages.
requires-python = ">=3.10,<3.12"
dependencies = [
    "typer",
    "rich",
    # Default PyPI wheel (includes CUDA on Linux). For a specific CUDA build use
    # the PyTorch index, e.g. --index-url https://download.pytorch.org/whl/cu121
    "torch",
    # Source separation (adefossez's Demucs fork, published on PyPI as `demucs`).
    "demucs",
    # Reads/writes the stem wav files.
    "soundfile",
    # Transcription: Basic Pitch (ICASSP 2022 model) via the ONNX backend.
    # Tested pin: basic-pitch==0.4.0. Its wheel metadata hard-requires
    # tensorflow<2.15.1 on Linux + Python 3.11, which forces numpy<2 and
    # conflicts with the torch stack, so it is NOT listed here; install it
    # without its dependency chain instead:
    #   pip install --no-deps basic-pitch==0.4.0
    # The dependencies its ONNX inference path actually needs are listed
    # below. With onnxruntime present (and no tensorflow), basic-pitch
    # auto-selects its bundled nmp.onnx model.
    "onnxruntime",
    # Key/chord/beat analysis (Phase 2): madmom. The last PyPI release
    # (0.16.1, 2018) does not build on Python 3.11 / numpy 2: its setup.py
    # imports Cython without declaring it as a build requirement, and the
    # code still uses the np.float/np.int aliases removed in numpy 1.24.
    # Upstream GitHub HEAD fixes both and builds/imports cleanly against
    # numpy 2.4 without downgrading numpy or torch, so we pin that commit.
    # Building from source needs git and a C compiler at install time.
    "madmom @ git+https://github.com/CPJKU/madmom@27f032e8947204902c675e5e341a3faf5dc86dae",
    "librosa",
    "pretty-midi",
    # Tablature export to Guitar Pro 5 (.gp5). Pinned: the gp5 writer is
    # sensitive to model-layout changes between releases.
    "pyguitarpro==0.11",
    # Tablature export to MusicXML. Pinned: the musicxml writer relies on
    # music21's makeNotation/tuplet handling, which shifts between releases.
    "music21==10.5.1",
    "mir-eval",
    "resampy>=0.2.2,<0.4.3",
    # Optional guitar transcriber (--transcriber riley,
    # tabgen/core/transcription/riley.py): numpy for the post-processing,
    # torchlibrosa (MIT) for the log-mel front end the checkpoint was trained
    # with (pinned: the spectrogram layers' state-dict keys must match), and
    # huggingface_hub to fetch the pinned guitar-gaps.pth weights.
    "numpy",
    "torchlibrosa==0.1.0",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    # Tests open the exported .mid files directly with mido (it is already a
    # transitive dependency via pretty_midi; listed here to make it explicit).
    "mido",
]

[project.scripts]
tabgen = "tabgen.cli.main:app"

[tool.setuptools.packages.find]
include = ["tabgen*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# T20 (flake8-print) forbids print/pprint; enforced everywhere, relaxed outside core below.
select = ["E", "F", "I", "W", "T20"]

[tool.ruff.lint.per-file-ignores]
# print is forbidden in tabgen/core/ (pure library); allowed in CLI and tests.
"tabgen/cli/**" = ["T201"]
"tests/**" = ["T201"]
